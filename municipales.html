    <!-- Modal de galería -->
    <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center">
        <div class="relative max-w-4xl max-h-full mx-4">
            <!-- Botón cerrar -->
            <button onclick="closeModal()"
                class="absolute top-4 right-4 text-grey text-3xl hover:text-accent-green transition-colors z-10">
                <i class="fas fa-times"></i>
            </button>

            <!-- Imagen con zoom -->
            <div id="zoom-container" class="overflow-hidden flex items-center justify-center"
                style="width:100%;height:80vh;">
                <img id="modal-image" src="" alt="" draggable="false"
                    class="max-w-full max-h-[80vh] object-contain transition-transform duration-200 cursor-zoom-in">
            </div>

            <!-- Botones navegación -->
            <button onclick="changeImage(-1)"
                class="absolute left-4 top-1/2 transform -translate-y-1/2 text-grey text-3xl hover:text-accent-green transition-colors">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button onclick="changeImage(1)"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-grey text-3xl hover:text-accent-green transition-colors">
                <i class="fas fa-chevron-right"></i>
            </button>

            <!-- Contador -->
            <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white text-lg">
                <span id="image-counter">1</span> / <span id="total-images">9</span>
            </div>
        </div>
    </div>


    <!-- Fancybox UMD (funciona sin bundler) -->

    <script>
        Fancybox.bind('[data-fancybox="gallery"]', {
            contentClick: "iterateZoom",
            Images: {
                initialSize: "fit",
                Panzoom: {
                    maxScale: 1.2,
                    minScale: 1,
                }
            },

            Toolbar: {
                display: [
                    { id: "counter", position: "center" },
                    "close",
                    "zoomIn",
                    "zoomOut",
                    "fullscreen"
                ]
            },
        });
        
    </script>
