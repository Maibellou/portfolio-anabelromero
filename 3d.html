<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos 3D - Ani Romero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#111111',
            'dark-card': '#1a1a1a',
            'dark-text': '#e2e8f0',
            'accent-green': '#10b981',
            'accent-green-dark': '#059669'
          },
          fontFamily: {
            'display': ['Playfair Display', 'serif'],
            'body': ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark-bg text-dark-text min-h-screen">
  <!-- Header y Navegación -->
  <header class="fixed top-0 w-full bg-dark-card/90 backdrop-blur-sm z-50 border-b border-gray-800">
    <nav class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-accent-green">Ani Romero</a>
        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html#inicio" class="hover:text-accent-green transition-colors">Inicio</a>
          <a href="index.html#portfolio" class="hover:text-accent-green transition-colors">Portfolio</a>
          <a href="index.html#contacto" class="hover:text-accent-green transition-colors">Contacto</a>
          <a href="https://www.linkedin.com/in/anabelromero-ar/" target="_blank" class="text-accent-green hover:text-accent-green-dark transition-colors">
            <i class="fab fa-linkedin text-xl"></i>
          </a>
        </div>
        <button id="menu-toggle" class="md:hidden text-dark-text hover:text-accent-green transition-colors">
          <i class="fas fa-bars text-xl"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Menú Mobile -->
  <div id="mobile-menu" class="fixed inset-0 bg-dark-bg z-50 hidden flex-col items-center justify-center space-y-8">
    <button id="close-menu" class="absolute top-6 right-6 text-2xl text-dark-text hover:text-accent-green transition-colors">
      <i class="fas fa-times"></i>
    </button>
    <a href="index.html#inicio" class="text-3xl font-semibold hover:text-accent-green transition-colors">Inicio</a>
    <a href="index.html#portfolio" class="text-3xl font-semibold hover:text-accent-green transition-colors">Portfolio</a>
    <a href="index.html#contacto" class="text-3xl font-semibold hover:text-accent-green transition-colors">Contacto</a>
    <a href="https://www.linkedin.com/in/anabelromero-ar/" target="_blank" class="text-3xl text-accent-green hover:text-accent-green-dark transition-colors">
      <i class="fab fa-linkedin"></i>
    </a>
  </div>

  <!-- Título -->
  <section class="pt-24 pb-8 px-4">
    <div class="container mx-auto max-w-6xl">
      <h1 class="text-4xl md:text-6xl font-display font-bold text-center mb-4 bg-gradient-to-r from-accent-green to-accent-green-dark bg-clip-text text-transparent">
        Proyectos 3D
      </h1>
      <p class="text-lg text-center text-gray-300 max-w-3xl mx-auto font-body font-light">
        Modelado tridimensional y visualizaciones arquitectónicas creadas con software especializado para presentar proyectos de manera inmersiva.
      </p>
    </div>
  </section>

  <!-- Galería de videos -->
  <section class="py-8 px-4">
    <div class="container mx-auto max-w-6xl">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Video 1 -->
        <div class="group cursor-pointer" onclick="openModal(0)">
          <div class="relative overflow-hidden rounded-lg bg-dark-card">
            <video src="src/Moreno3D.mp4" 
                   class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300"
                   muted loop playsinline></video>
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <i class="fas fa-play text-3xl text-white"></i>
            </div>
          </div>
        </div>
        <!-- Video 2 -->
        <div class="group cursor-pointer" onclick="openModal(2)">
          <div class="relative overflow-hidden rounded-lg bg-dark-card">
            <video src="src/Moreno3D.mp4" 
                   class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300"
                   muted loop playsinline></video>
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <i class="fas fa-play text-3xl text-white"></i>
            </div>
          </div>
        </div>
        <!-- Video 3 -->
        <div class="group cursor-pointer" onclick="openModal(3)">
          <div class="relative overflow-hidden rounded-lg bg-dark-card">
            <video src="src/Moreno3D.mp4" 
                   class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300"
                   muted loop playsinline></video>
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <i class="fas fa-play text-3xl text-white"></i>
            </div>
          </div>
        </div>
        <!-- Podés duplicar este bloque cambiando el índice y src para más videos -->
      </div>
    </div>
  </section>

  <!-- Modal de video -->
  <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center">
    <div class="relative w-full h-full flex items-center justify-center">
      <!-- Botón cerrar -->
      <button onclick="closeModal()" class="absolute top-6 right-6 text-white text-3xl hover:text-accent-green transition-colors z-10">
        <i class="fas fa-times"></i>
      </button>
      <!-- Video -->
      <video id="modal-video" src="" controls autoplay class="w-full h-full object-contain bg-black"></video>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const videos = [
      "src/Moreno3D.mp4",
      "src/Moreno3D.mp4",
      "src/Moreno3D.mp4"
      // Agregá más rutas si tenés más videos
    ];
    let currentVideoIndex = 0;

    function openModal(index) {
      currentVideoIndex = index;
      const modal = document.getElementById('modal');
      const video = document.getElementById('modal-video');
      video.src = videos[currentVideoIndex];
      video.play();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      const video = document.getElementById('modal-video');
      video.pause();
      video.currentTime = 0;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = 'auto';
    }

    // Escape cierra modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // Menú mobile
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const closeMenu = document.getElementById('close-menu');
    const menuLinks = mobileMenu.querySelectorAll('a');

    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.remove('hidden');
      mobileMenu.classList.add('flex');
    });
    closeMenu.addEventListener('click', () => {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('flex');
    });
    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('flex');
      });
    });
  </script>
</body>
</html>
